name: Bug Report
description: Reporta un error en TRAMA
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Describe detalladamente el comportamiento inesperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Pasos exactos para llegar al problema.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué esperabas que sucediera.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de TRAMA
      description: Ej. v1.0.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistema Operativo
      description: Ej. macOS Sonoma, Windows 11
    validations:
      required: true
