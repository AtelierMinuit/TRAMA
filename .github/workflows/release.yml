name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Locate build artifacts
        id: artifacts
        run: |
          bundle_dir="src-tauri/target/release/bundle"
          app_path=$(find "$bundle_dir/macos" -name "*.app" | head -n1)
          dmg_path=$(find "$bundle_dir/dmg" -name "*.dmg" | head -n1)
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          test -n "$app_path"
          test -n "$dmg_path"

      - name: Create app zip
        run: |
          cd "$(dirname "${{ steps.artifacts.outputs.app_path }}")"
          ditto -c -k --keepParent "$(basename "${{ steps.artifacts.outputs.app_path }}")" "${{ github.workspace }}/TRAMA-macos.zip"

      - name: Compute SHA-256 checksums
        id: checksums
        run: |
          cd "${{ github.workspace }}"
          shasum -a 256 TRAMA-macos.zip > checksums-sha256.txt
          shasum -a 256 "${{ steps.artifacts.outputs.dmg_path }}" >> checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TRAMA-macos.zip
            ${{ steps.artifacts.outputs.dmg_path }}
            checksums-sha256.txt
          fail_on_unmatched_files: true
